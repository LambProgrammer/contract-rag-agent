# ============================================================
# Contract RAG Agent — Docker Compose 编排
#
#   docker compose up -d       # 启动所有服务
#   docker compose down -v       # 停止并删除数据卷
# ============================================================


services:
  # ============================================================
  # 1. FastAPI 应用服务
  # ============================================================
  app:
    build: .
    container_name: contract-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内连接，覆盖 .env 中的 localhost
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    volumes:
      - ./uploads:/app/uploads
      - ./src:/app/src          # 开发期热重载，生产部署应去掉
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # 2. Celery Worker 服务
  # ============================================================
  worker:
    build: .
    container_name: contract-rag-worker
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    volumes:
      - ./uploads:/app/uploads
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: uv run celery -A src.tasks.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    healthcheck:
      test: ["CMD", "uv", "run", "celery", "-A", "src.tasks.celery_app", "inspect", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s  # Worker 启动较慢，给 30s 预热
    restart: unless-stopped

  # ============================================================
  # 3. PostgreSQL 数据库
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: contract-rag-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-contract_rag}
    ports:
      - "5432:5432"             # 开发调试用，方便本地工具直连
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-contract_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # 4. Redis 服务
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: contract-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # 5. Qdrant 向量数据库
  # ============================================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: contract-rag-qdrant
    ports:
      - "6333:6333"             # REST API
      - "6334:6334"             # gRPC（备用）
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

# ============================================================
# 持久化存储卷
# ============================================================
volumes:
  postgres_data:
  redis_data:
  qdrant_data:

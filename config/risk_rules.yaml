# ============================================================
# 合同风险检测规则配置
# ============================================================
# 在 RAG 系统中的角色：
#   定义风险检测的关键词匹配规则。A2 的 rule_engine.py 遍历合同 Chunks，
#   用这些规则逐条匹配文本；命中的条目送入 A3 的 llm_verifier.py 做 LLM 二次确认。
#
# 规则字段说明：
#   id:          唯一标识
#   name:        风险名称（展示给用户）
#   keywords:    触发关键词列表（任一命中即触发）
#   severity:    low / medium / high / critical
#   description: 风险说明（为什么这可能是风险）
#   suggestion:  建议操作（用户应该检查什么）
#
# 严重程度定义：
#   low:      可能存在优化空间，不影响合同效力
#   medium:   可能对一方不利，建议协商修改
#   high:     明显不公平或存在较大法律风险
#   critical: 可能违反法律法规强制性规定，合同条款可能无效
#
# 规则来源：
#   基于《民法典》合同编常见争议点及通用合同审查 checklist。
#   覆盖违约金、解除权、责任限制、争议解决、付款、知识产权、
#   保密、自动续约、生效条件、不可抗力等场景。
# ============================================================

rules:
  # ----------------------------------------------------------
  # 违约金相关
  # ----------------------------------------------------------
  - id: "R001"
    name: "违约金比例可能过高"
    keywords:
      - "违约金"
      - "赔偿金"
      - "罚金"
    severity: "high"
    description: "合同约定了违约金或赔偿条款。根据《民法典》第585条，违约金超过实际损失30%的，可能被认定为过高，法院可予以适当减少。"
    suggestion: "检查违约金比例是否超过合同总价的30%，或是否与实际损失严重不对等。"

  - id: "R002"
    name: "单方任意解除权"
    keywords:
      - "单方解除"
      - "任意解除"
      - "随时终止"
      - "无需理由"
      - "无条件解除"
    severity: "critical"
    description: "条款赋予一方单方、无条件解除合同的权利，可能构成格式条款无效情形（《民法典》第497条）。"
    suggestion: "确认解除权是否对等；如不对等，建议增加对另一方的事先通知期和合理补偿。"

  # ----------------------------------------------------------
  # 责任限制相关
  # ----------------------------------------------------------
  - id: "R003"
    name: "责任限制可能过低"
    keywords:
      - "责任上限"
      - "赔偿上限"
      - "最高赔偿额"
      - "不承担责任"
      - "免责"
    severity: "high"
    description: "条款限制了违约方的赔偿责任上限。若上限过低（如仅限合同金额），可能不足以覆盖实际损失。根据《民法典》第506条，人身损害责任及故意或重大过失责任不得预先免除。"
    suggestion: "检查赔偿上限是否合理；确认免责范围未覆盖人身损害和故意/重大过失情形。"

  - id: "R004"
    name: "间接损失排除条款"
    keywords:
      - "间接损失"
      - "附带损失"
      - "利润损失"
      - "商誉损失"
    severity: "medium"
    description: "条款排除了间接损失的赔偿。这在商业合同中常见，但对违约受害方保护不足——若对方违约导致营业中断，利润损失可能远超直接损失。"
    suggestion: "评估己方业务特点：若对方违约可能造成重大营业中断损失，建议删除或限制该条款适用范围。"

  # ----------------------------------------------------------
  # 争议解决相关
  # ----------------------------------------------------------
  - id: "R005"
    name: "争议管辖地可能不利"
    keywords:
      - "管辖法院"
      - "诉讼地"
    severity: "medium"
    description: "合同约定了争议解决的管辖法院。若约定在对方所在地，将增加己方维权成本。"
    suggestion: "建议争取约定在己方所在地法院管辖，或选择双方均可接受的第三地。"

  - id: "R006"
    name: "仲裁条款约定不明"
    keywords:
      - "仲裁委员会"
      - "仲裁机构"
      - "提交仲裁"
      - "仲裁地"
    severity: "high"
    description: "合同涉及仲裁但机构名称可能不明确。根据《仲裁法》第18条，仲裁协议对仲裁委员会没有约定或约定不明确的，当事人可补充协议；达不成补充协议的，仲裁协议无效。"
    suggestion: "确认仲裁机构全称准确无误（例如'中国国际经济贸易仲裁委员会'而非'贸仲'），避免因名称模糊导致仲裁协议无效。"

  # ----------------------------------------------------------
  # 付款/价格相关
  # ----------------------------------------------------------
  - id: "R007"
    name: "付款条件主观化"
    keywords:
      - "验收合格后"
      - "满意后"
      - "酌情支付"
      - "视情况"
      - "另行协商"
    severity: "high"
    description: "付款条件使用了主观性标准（如'满意后支付'、'视情况支付'），缺乏客观判断依据，可能导致付款被无限期拖延。"
    suggestion: "将付款条件替换为客观可验证的标准（如'双方签字确认验收报告后X个工作日内'）。"

  - id: "R008"
    name: "长期合同缺乏价格调整机制"
    keywords:
      - "固定价格"
      - "总价包干"
      - "不调整"
    severity: "low"
    description: "合同采用固定总价且无价格调整机制。长期合同中原材料、人工成本波动可能导致一方严重亏损。"
    suggestion: "对履行期限超过1年的合同，建议增加调价条款（如挂钩CPI指数或特定原材料价格指数）。"

  # ----------------------------------------------------------
  # 知识产权相关
  # ----------------------------------------------------------
  - id: "R009"
    name: "知识产权归属不明确"
    keywords:
      - "知识产权"
      - "著作权"
      - "专利权"
      - "商标权"
      - "技术成果"
      - "开发成果"
    severity: "high"
    description: "合同中涉及智力成果或技术开发但未明确知识产权归属。履行过程中产生的成果归属争议是合同纠纷高发区。"
    suggestion: "明确约定成果的知识产权归谁所有、双方的后续使用权限、衍生成果的归属和处理方式。"

  - id: "R010"
    name: "保密条款缺失或过弱"
    keywords:
      - "保密"
      - "商业秘密"
      - "NDA"
    severity: "medium"
    description: "合同涉及商业信息交换但保密条款缺失或约定过于笼统，无法有效约束对方的信息使用行为。"
    suggestion: "建议明确保密信息的范围和载体形式、保密期限（建议合同终止后3-5年）、违约泄露的赔偿标准。"

  # ----------------------------------------------------------
  # 合同生效与期限
  # ----------------------------------------------------------
  - id: "R011"
    name: "自动续约条款"
    keywords:
      - "自动续期"
      - "自动续约"
      - "自动延期"
      - "默认续签"
    severity: "medium"
    description: "合同约定到期自动续约，可能导致一方在不需要继续服务时因疏忽未在到期前发出终止通知而被迫延长。"
    suggestion: "确认是否需要自动续约；如需，设置合理的提前通知期（如到期前30天）以便双方评估。"

  - id: "R012"
    name: "合同生效条件繁重"
    keywords:
      - "附条件生效"
      - "前置条件"
      - "先决条件"
    severity: "low"
    description: "合同约定了多项生效前置条件。条件过多可能导致合同长期无法生效，影响业务推进。"
    suggestion: "评估每项前置条件的必要性和可实现性，尽量简化至双方签字盖章即生效。"

  # ----------------------------------------------------------
  # 不可抗力
  # ----------------------------------------------------------
  - id: "R013"
    name: "不可抗力范围需核实"
    keywords:
      - "不可抗力"
      - "天灾"
      - "政府行为"
      - "疫情"
      - "流行病"
    severity: "medium"
    description: "合同中定义了不可抗力的范围。若范围过宽（如列入'市场变化'等商业风险），可能被滥用为逃避履约的借口；若过窄，则无法覆盖合理的免责情形。"
    suggestion: "对照《民法典》第180条和第590条，确认不可抗力范围合理，商业风险不应纳入不可抗力。"
